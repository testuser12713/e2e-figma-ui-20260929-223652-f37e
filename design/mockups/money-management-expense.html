<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Expense — BusinessHandler</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <div class="statusbar">
      <span class="time">9:41</span>
      <span class="status-icons">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="none" stroke="#23233C" stroke-width="1.2"><path d="M1 8h2.5M3.5 5.5H7M6 3h3M9 8h2.5M11.5 5.5H15M13 3h3"/></svg>
        <svg width="16" height="11" viewBox="0 0 16 11" fill="none" stroke="#23233C" stroke-width="1.2"><path d="M1 3.5a10 10 0 0 1 14 0M3.5 6a6 6 0 0 1 9 0M6 8.5a3 3 0 0 1 4 0"/><circle cx="8" cy="10" r="0.8" fill="#23233C"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="#23233C" stroke-opacity="0.4"/><rect x="2" y="2" width="16" height="8" rx="1.5" fill="#23233C"/><path d="M23 4v4" stroke="#23233C" stroke-width="1.2"/></svg>
      </span>
    </div>

    <div class="screen">
      <div class="header-white" data-od-id="header">
        <div class="topbar">
          <a class="icon-btn" href="money-management.html" aria-label="Back">
            <svg width="11" height="18" viewBox="0 0 11 18" fill="none" stroke="#181461" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 1.5 2 9l7.5 7.5"/></svg>
          </a>
          <span class="icon-btn" aria-label="Profile">
            <svg width="27" height="27" viewBox="0 0 27 27" fill="none" stroke="#181461" stroke-width="1.5"><circle cx="13.5" cy="9.5" r="4.5"/><path d="M5 23c1.5-4.5 4.7-6.5 8.5-6.5S20.5 18.5 22 23"/></svg>
          </span>
        </div>
        <h1 class="form-title" data-od-id="title">Add Expense</h1>
      </div>

      <div class="content" style="padding-top: 24px;">
        <label class="field" data-od-id="field-name">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#23233C" stroke-width="1.5"><path d="M2 2h5l7 7-5 5-7-7z"/><circle cx="5.5" cy="5.5" r="1.2"/></svg>
          <input type="text" placeholder="Name">
        </label>

        <label class="field" data-od-id="field-description">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#23233C" stroke-width="1.5"><path d="M3 3h10v10H3z"/><path d="M5.5 6.5h5M5.5 9.5h5"/></svg>
          <input type="text" placeholder="Beschreibung">
        </label>

        <label class="field" data-od-id="field-amount">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#23233C" stroke-width="1.5"><rect x="1.5" y="4.5" width="13" height="7" rx="1.5"/><circle cx="8" cy="8" r="1.8"/><path d="M3 7.5h.01M13 8.5h.01"/></svg>
          <input type="text" placeholder="Amount">
        </label>

        <label class="field" data-od-id="field-date">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#23233C" stroke-width="1.5"><rect x="1.5" y="3" width="13" height="11" rx="2"/><path d="M1.5 7h13M5 1v3M11 1v3"/></svg>
          <input type="text" placeholder="Select Date">
        </label>

        <a class="btn-primary" href="money-management.html" data-od-id="btn-add-expense">Add Expense</a>
      </div>
    </div>

    <nav class="tabbar" data-od-id="tabbar">
      <a class="tab" href="dashboard.html" data-od-id="tab-home">
        <svg width="22" height="21" viewBox="0 0 22 21" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M3 10.5 11 3l8 7.5"/><path d="M5 9v9h12V9"/></svg>
        <span class="tab-label">Home</span>
      </a>
      <a class="tab active" href="money-management.html" data-od-id="tab-money">
        <svg width="19" height="19" viewBox="0 0 19 19" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M3 7l1-4h11l1 4"/><path d="M3 7h13v9H3z"/><path d="M7 16v-5h5v5"/></svg>
        <span class="tab-label">Money</span>
      </a>
      <span class="tab"></span>
      <a class="tab" href="time-management.html" data-od-id="tab-time">
        <svg width="15" height="18" viewBox="0 0 15 18" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="4.5" r="3"/><path d="M1.5 17c1-3.5 2.5-5 4.5-5s3.5 1.5 4.5 5"/><path d="M10.5 10l1.5 1.5L15 9"/></svg>
        <span class="tab-label">Time</span>
      </a>
    </nav>

    <a class="fab" href="money-management-expense.html" aria-label="Add expense" data-od-id="fab">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 0v20" stroke="#FFFFFF" stroke-width="3"/><path d="M0 10h20" stroke="#FFFFFF" stroke-width="3"/></svg>
    </a>
  </div>
</body>
</html>
